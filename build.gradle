buildscript {
    repositories {
        google()
        mavenCentral()
    }
    ext.kotlin_version = "2.0.0"
    dependencies {
        classpath "com.android.tools.build:gradle:8.5.0"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.google.dagger:hilt-android-gradle-plugin:2.50"
    }
}
